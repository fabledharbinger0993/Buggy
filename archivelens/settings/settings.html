<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ArchiveLens — Settings</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <main class="shell">
      <h1>ArchiveLens Settings</h1>
      <p class="subtitle">
        Local Ollama inference, crawl policy, and tracing options.
        Saved into the extension's IndexedDB store.
      </p>

      <form id="settingsForm">
        <fieldset>
          <legend>Ollama (Local Inference)</legend>
          <label>Endpoint
            <input id="ollamaEndpoint" type="url" placeholder="http://localhost:11434/api/generate" />
          </label>
          <label>Model
            <input id="ollamaModel" type="text" placeholder="llama3" />
          </label>
        </fieldset>

        <fieldset>
          <legend>Crawl Policy</legend>
          <label>Confidence Threshold (0–1)
            <input id="confidenceThreshold" type="number" min="0" max="1" step="0.05" />
          </label>
          <label>Crawl Depth
            <input id="crawlDepth" type="number" min="1" max="10" step="1" />
          </label>
          <label>Crawl Delay (seconds between requests)
            <input id="crawlDelaySeconds" type="number" min="0" max="60" step="1" />
          </label>
          <label>Max Retries
            <input id="maxRetries" type="number" min="0" max="10" step="1" />
          </label>
          <label>Contact Email (for User-Agent)
            <input id="contactEmail" type="email" placeholder="researcher@example.com" />
          </label>
        </fieldset>

        <fieldset>
          <legend>Chunking</legend>
          <label>Chunk Token Limit
            <input id="chunkTokenLimit" type="number" min="100" max="8000" step="100" />
          </label>
          <label>Chunk Overlap Tokens
            <input id="chunkOverlapTokens" type="number" min="0" max="2000" step="50" />
          </label>
        </fieldset>

        <fieldset>
          <legend>Pipeline Optimization</legend>
          <label>Chunk Batch Size (chunks per Ollama call)
            <input id="chunkBatchSize" type="number" min="1" max="20" step="1" />
          </label>
          <label>Ollama Concurrency (parallel batches)
            <input id="ollamaConcurrency" type="number" min="1" max="8" step="1" />
          </label>
          <label class="checkbox">
            <input id="useGlobalSynthesis" type="checkbox" />
            <span>Use global entity synthesis (single-call clustering)</span>
          </label>
        </fieldset>

        <fieldset>
          <legend>Embeddings Service (optional)</legend>
          <label>Service URL (leave blank to disable)
            <input id="embeddingsServiceUrl" type="url" placeholder="http://localhost:5050" />
          </label>
          <label class="checkbox">
            <input id="useSemanticClustering" type="checkbox" />
            <span>Cluster chunks semantically before extraction</span>
          </label>
        </fieldset>

        <fieldset>
          <legend>Tracing (OTLP)</legend>
          <label class="checkbox">
            <input id="tracingEnabled" type="checkbox" />
            <span>Enable tracing</span>
          </label>
          <label>Tracing Endpoint
            <input id="tracingEndpoint" type="url" placeholder="http://localhost:4318/v1/traces" />
          </label>
          <label>Service Name
            <input id="tracingServiceName" type="text" placeholder="archivelens-extension" />
          </label>
        </fieldset>

        <div class="actions">
          <button id="saveBtn" type="submit">Save Settings</button>
          <button id="resetBtn" type="button">Reset to Defaults</button>
        </div>

        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script src="settings.js"></script>
  </body>
</html>
