<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>FungAI P.I.</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Space+Mono:wght@400;700&display=swap"
    />
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        background: #08080f; color: #e8e4d8; font-family: "Space Mono", monospace;
        display: flex; align-items: center; justify-content: center; padding: 0 16px;
      }
      form { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 280px; }
      h1 {
        font-family: "Orbitron", sans-serif; font-size: 18px; letter-spacing: 0.15em;
        text-align: center; margin: 0 0 8px; text-shadow: 0 0 12px rgba(155, 114, 216, 0.6);
      }
      label { color: #8884a0; font-size: 12px; }
      input, button {
        font: inherit; font-size: 14px; padding: 10px 12px; border-radius: 4px;
        border: 1px solid #2a2a3a; background: #161624; color: #e8e4d8;
      }
      input:focus { outline: 2px solid #9b72d8; outline-offset: 1px; }
      button { background: #6b3fa0; border-color: #9b72d8; cursor: pointer; font-weight: 700; }
      button:disabled { opacity: 0.6; cursor: wait; }
      #error { color: #d45a5a; font-size: 12px; min-height: 1em; margin: 0; }
    </style>
  </head>
  <body>
    <form id="login">
      <h1>FUNGA.I. P.I.</h1>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
      <button type="submit">Enter</button>
      <p id="error" role="alert"></p>
    </form>
    <script>
      const form = document.getElementById("login");
      const errorEl = document.getElementById("error");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const button = form.querySelector("button");
        const input = document.getElementById("password");
        button.disabled = true;
        errorEl.textContent = "";
        try {
          const resp = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: input.value }),
          });
          const data = await resp.json().catch(() => ({}));
          if (resp.ok && data.ok) return location.reload();
          errorEl.textContent = data.error || "Login failed (" + resp.status + ")";
        } catch {
          errorEl.textContent = "Could not reach the server";
        }
        input.value = "";
        button.disabled = false;
      });
    </script>
  </body>
</html>
